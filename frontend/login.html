<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ProcureAI</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">ProcureAI</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">AI-powered Supplier Discovery & Procurement Intelligence</p>
      </div>

      <div id="login-error" style="display: none; background: rgba(239,68,68,0.2); color: #f87171; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.85rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;" id="login-submit-btn">Masuk ke Sistem</button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        Akses khusus tim Purchasing internal.<br>
        Akun default: <code>admin</code> / <code>AdminProcureAI2026!</code>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Quick autofill if empty
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-submit-btn');

      try {
        btn.disabled = true;
        btn.textContent = 'Memverifikasi...';

        const res = await API.request('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });

        API.setToken(res.token);
        API.setUser(res.user);
        window.location.href = '/index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk ke Sistem';
      }
    });
  </script>
</body>
</html>
